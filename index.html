  if (!audioCtx) {

  if (audioCtx.state === "suspended") audioCtx.resume();
}
function tone(freq, dur, vol=0.25, type="sine", delay=0, slideTo=null) {
  if (state.muted || !audioCtx) return;
  const t0 = audioCtx.currentTime + delay;
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t0);
  if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(g).connect(audioCtx.destination);
  osc.start(t0); osc.stop(t0 + dur + 0.05);
}

  while (commentsEl.children.length > 22) commentsEl.removeChild(commentsEl.firstChild);
  if (document.body.classList.contains("screen-mode"))
    commentsEl.scrollTop = commentsEl.scrollHeight;
  setTimeout(() => { if (el.parentNode) el.remove(); }, 13000);

  pipAdd(nick, text, color, !!opts.reply);
  rememberMessage({ nick, text, time:Date.now(),
    isResident:!!opts.isResident, kind:opts.kind || null });
}

function spawnNote(text, sub="", color="#ffd700") {
  const el = document.createElement("div");
  el.className = "note";
  el.style.borderLeftColor = color;
  el.innerHTML = `<b style="color:${color}">${text}</b>${sub ? `<small>${sub}</small>` : ""}`;
  notesEl.appendChild(el);
  setTimeout(() => { if (el.parentNode) el.remove(); }, 4500);
}

function spawnBanner(text, sub, color, nick) {
  bannerEl.innerHTML = `
    <div class="t" style="color:${color}">${text}</div>
    ${sub ? `<div class="s">${sub}</div>` : ""}
    ${nick ? `<div class="n" style="color:${color}">${nick}</div>` : ""}`;
  bannerEl.style.borderColor = color;
  bannerEl.style.boxShadow = `0 0 40px ${color}66`;
  bannerEl.style.display = "block";
  clearTimeout(spawnBanner._t);
  spawnBanner._t = setTimeout(() => { bannerEl.style.display = "none"; }, 4000);
}

function boom(emoji, count=16) {
  for (let i=0; i<count; i++) {
    const el = document.createElement("div");
    el.className = "heart";
    el.textContent = emoji;
    el.style.right = (Math.random()*40) + "px";
    el.style.left = "auto";
    el.style.fontSize = ri(20,34) + "px";
    heartsEl.appendChild(el);
    const vx = (Math.random()-0.5)*30;
    const vy = document.body.classList.contains("screen-mode") ? ri(220,400) : -ri(220,400);
    el.animate([
      { transform:"translate(0,0)", opacity:1 },
      { transform:`translate(${vx}px,${vy}px)`, opacity:0 }
    ], { duration: ri(1500,2400), easing:"ease-out" }).onfinish = () => el.remove();
  }
}

function shakeUI() {
  const ui = document.getElementById("ui");
  ui.classList.add("shake");
  setTimeout(() => ui.classList.remove("shake"), 420);
}

const REPLY_TO_SPAM     = ["67 67 67","67 топ","сам 67","67???","да 67",
  "хватит спамить","забаньте его","опять этот 67","😂 67 снова"];
const REPLY_TO_HATE     = ["сам такой","не нравится — выйди","хейтер детектед",
  "завидуй молча","а ты кто такой?","лох сам","ахахах хейтер"];
const REPLY_TO_SIMP     = ["фууу","кринж","иди отсюда","😂😂😂","simp детектед",
  "он тебя не заметит","кринжово"];
const REPLY_TO_QUESTION = ["а сам как думаешь?","он говорил уже","перемотай стрим",
  "загугли","ну ты и спросил","очевидно же"];
const REPLY_TO_CLOWN    = ["😂😂😂","я тоже ору","жиза","ахахах","ты жжёшь"];
const GENERIC_REPLY     = ["согласен","база","ну да","это точно","плюсую",
  "жиза братан","ты прав","+1","💯"];

function pickReplyFor(prev) {
  if (!prev) return rnd(GENERIC_REPLY);
  if (prev.kind === "spam")     return rnd(REPLY_TO_SPAM);
  if (prev.kind === "hater")    return rnd(REPLY_TO_HATE);
  if (prev.kind === "simp")     return rnd(REPLY_TO_SIMP);
  if (prev.kind === "asker")    return rnd(REPLY_TO_QUESTION);
  if (prev.kind === "clown")    return rnd(REPLY_TO_CLOWN);
  const t = (prev.text||"").toLowerCase();
  if (t.includes("67") || t.includes("скибиди")) return rnd(REPLY_TO_SPAM);
  if (/\?$/.test(prev.text)) return rnd(REPLY_TO_QUESTION);
  if (prev.text.includes("😂") || prev.text.includes("🤡")) return rnd(REPLY_TO_CLOWN);
  return rnd(GENERIC_REPLY);
}

function residentReply() {
  const now = Date.now();
  const candidates = recentMessages.filter(m => m.isResident && (now - m.time) < 4500);
  const target = candidates.length > 0 ? rnd(candidates) : null;
  let responder;
  do { responder = rnd(RESIDENTS); } while (target && responder.nick === target.nick);
  spawnChat(pickReplyFor(target), responder.nick, responder.color,
    { isResident:true, kind:responder.kind, reply:true });
  sfx.reply();
}

function residentSpam(resident) {
  spawnChat(rnd(resident.lines), resident.nick, resident.color,
    { isResident:true, kind:resident.kind });
}

function detectThemes(text) {
  const t = (text||"").toLowerCase();
  const found = [];
  for (const th of THEMES) if (th.keys.some(k => t.includes(k))) found.push(th);
  return found;
}

function onUserSpoke(text) {
  if (!text || text.trim().length < 2) return;
  captionEl.textContent = text;
  captionEl.style.display = "block";
  clearTimeout(captionEl._t);
  captionEl._t = setTimeout(() => { captionEl.style.display = "none"; }, 3500);
  const themes = detectThemes(text);
  const n = ri(3, 5);
  for (let i = 0; i < n; i++) {
    setTimeout(() => {
      if (themes.length > 0 && Math.random() < 0.75) spawnChat(rnd(rnd(themes).replies));
      else spawnChat();
    }, i * ri(180, 420));
  }
  if (Math.random() < 0.6) setTimeout(() => residentReply(), ri(400, 900));
  state.hype = Math.min(1, state.hype + 0.15);
}

function bigEvent() {
  if (Math.random() < 0.55) {
    const [name, color] = rnd(BLOGGERS);
    spawnBanner(`⭐ ${name} зашёл`, "топ-блогер 🎉", color, name);
    spawnNote(`${name} зашёл`, "известный блогер", color);
    sfx.blogger();
    state.tv += ri(4000, 15000); state.likes += ri(3000, 9000);
    state.hype = Math.min(1, state.hype + 0.6); boom("🔥", 20);
    for (let i=0; i<8; i++)
      setTimeout(() => spawnChat(rnd([`${name} тут!`,"ооо это же он","го го го 🔥",`${name} привет!`])), i*120);
  } else {
    const d = rnd(DONATORS), a = rnd([1000,2000,5000,10000]), c = rnd(DONATE_COMMENTS);
    spawnBanner(`💎 ${d} → ${a.toLocaleString("ru-RU")} ₽`, c, "#ff50b4", d);
    spawnNote(`${d} +${a.toLocaleString("ru-RU")} ₽`, c, "#ff78c8");
    sfx.donateBig();
    state.coins += a*10; state.tv += ri(1000,4000);
    state.hype = Math.min(1, state.hype + 0.6); boom("💎", 18);
  }
  state.lastEvent = Date.now(); shakeUI();
}

function smallEvent() {
  const r = Math.random();
  if (r < 0.35) {
    state.likes += ri(80,500); state.hype = Math.min(1, state.hype + 0.08);
    sfx.like(); boom(rnd(["❤️","🔥","👍"]), 6);
  } else if (r < 0.7) {
    boom(rnd(EMOJIS), ri(4,9)); sfx.pop();
  } else {
    const d = rnd(DONATORS), a = rnd([50,100,200,500]);
    state.coins += a*10;
    spawnNote(`${d} +${a} ₽`, rnd(DONATE_COMMENTS), "#ff96dc");
    sfx.donateSmall(); boom("💎", 5);
  }
  state.lastEvent = Date.now();
}

let lastTick = performance.now();
function updateCounters(dt) {
  state.hype = Math.max(0, state.hype - dt*0.18);
  state.tv += 4*dt + state.hype*500*dt;
  state.viewers += (state.tv - state.viewers) * Math.min(1, dt*2.2);
  if (Date.now() - state.lastEvent > 15000) state.tv *= (1 - 0.01*dt);
  const v = state.viewers;
  $("viewers").textContent = v > 999 ? (v/1000).toFixed(1) + "K" : Math.floor(v);
}

// ============ PiP CANVAS ============
const pipCanvas = document.createElement("canvas");
pipCanvas.width = 540;
pipCanvas.height = 960;
const pipCtx = pipCanvas.getContext("2d");
const pipVideo = $("pipVideo");
let pipStream = null;

function drawCovered(ctx, video, W, H, mirror) {
  if (!video || video.readyState < 2 || !video.videoWidth) return;
  const vw = video.videoWidth, vh = video.videoHeight;
  const scale = Math.max(W/vw, H/vh);
  const dw = vw*scale, dh = vh*scale;
  const dx = (W-dw)/2, dy = (H-dh)/2;
  if (mirror) {
    ctx.save(); ctx.translate(W, 0); ctx.scale(-1, 1);
    ctx.drawImage(video, W-dx-dw, dy, dw, dh);
    ctx.restore();
  } else {
    ctx.drawImage(video, dx, dy, dw, dh);
  }
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

function renderPiP() {
  const W = pipCanvas.width, H = pipCanvas.height;
  pipCtx.fillStyle = "#000";
  pipCtx.fillRect(0, 0, W, H);

  const cam = $("cam"), screen = $("screen");
  const useScreen = state.screenOn && screen.readyState >= 2 && screen.videoWidth;
  if (useScreen) drawCovered(pipCtx, screen, W, H, false);
  else drawCovered(pipCtx, cam, W, H, state.facing === "user");

  const grad = pipCtx.createLinearGradient(0, H*0.55, 0, H);
  grad.addColorStop(0, "rgba(0,0,0,0)");
  grad.addColorStop(1, "rgba(0,0,0,0.75)");
  pipCtx.fillStyle = grad;
  pipCtx.fillRect(0, H*0.55, W, H*0.45);

  const now = Date.now();
  const items = pipHistory.filter(m => now - m.t < 12000).slice(-9);
  let y = H - 40;
  pipCtx.textBaseline = "bottom";
  for (let i = items.length - 1; i >= 0; i--) {
    const m = items[i];
    const size = 20;
    pipCtx.font = `600 ${size}px -apple-system,sans-serif`;
    const nickW = pipCtx.measureText(m.nick + ": ").width;
    let finalText = m.text;
    const maxW = W - 100;
    while (pipCtx.measureText(finalText).width + nickW > maxW && finalText.length > 1) {
      finalText = finalText.slice(0, -1);
    }
    const padX = 12, padY = 8;
    const lineW = nickW + pipCtx.measureText(finalText).width;
    const x = m.isReply ? 40 : 20;
    pipCtx.fillStyle = "rgba(0,0,0,0.5)";
    roundRect(pipCtx, x, y - size - padY, lineW + padX*2, size + padY*2, 14);
    pipCtx.fill();
    pipCtx.fillStyle = m.color || "#fff";
    pipCtx.font = `700 ${size}px -apple-system,sans-serif`;
    pipCtx.fillText(m.nick + ":", x + padX, y);
    pipCtx.fillStyle = "#f0f0f0";
    pipCtx.font = `500 ${size}px -apple-system,sans-serif`;
    pipCtx.fillText(finalText, x + padX + nickW, y);
    y -= size + padY * 2 + 4;
    if (y < H * 0.4) break;
  }

  if (state.screenOn) {
    const iw = 130, ih = 40, ix = (W - iw)/2, iy = 20;
    pipCtx.fillStyle = "#000";
    roundRect(pipCtx, ix, iy, iw, ih, 20);
    pipCtx.fill();
    if (cam.readyState >= 2 && cam.videoWidth) {
      pipCtx.save();
      pipCtx.beginPath();
      pipCtx.arc(ix + 20, iy + ih/2, 14, 0, Math.PI*2);
      pipCtx.closePath();
      pipCtx.clip();
      const px = ix + 20, py = iy + ih/2;
      pipCtx.translate(px*2, 0);
      pipCtx.scale(-1, 1);
      const vw = cam.videoWidth, vh = cam.videoHeight;
      const s = Math.max(28/vw, 28/vh);
      const dw = vw*s, dh = vh*s;
      pipCtx.drawImage(cam, px - dw/2, py - dh/2, dw, dh);
      pipCtx.restore();
    }
    const dotX = ix + iw - 60, dotY = iy + ih/2;
    const pulse = 0.5 + 0.5*Math.sin(now/400);
    pipCtx.fillStyle = `rgba(255,56,56,${0.6 + 0.4*pulse})`;
    pipCtx.beginPath(); pipCtx.arc(dotX, dotY, 5, 0, Math.PI*2); pipCtx.fill();
    pipCtx.fillStyle = "#fff";
    pipCtx.font = "800 14px -apple-system,sans-serif";
    pipCtx.textBaseline = "middle";
    pipCtx.fillText("REC", dotX + 10, dotY);
    pipCtx.textBaseline = "bottom";
  }

  pipCtx.fillStyle = "#ff2850";
  roundRect(pipCtx, 16, 16, 60, 26, 6);
  pipCtx.fill();
  pipCtx.fillStyle = "#fff";
  pipCtx.font = "800 14px -apple-system,sans-serif";
  pipCtx.textBaseline = "middle";
  pipCtx.fillText("LIVE", 30, 29);
  pipCtx.fillStyle = "rgba(0,0,0,.5)";
  const vTxt = "👁 " + (state.viewers > 999 ? (state.viewers/1000).toFixed(1) + "K" : Math.floor(state.viewers));
  pipCtx.font = "700 14px -apple-system,sans-serif";
  const vw2 = pipCtx.measureText(vTxt).width + 20;
  roundRect(pipCtx, 84, 16, vw2, 26, 6);
  pipCtx.fill();
  pipCtx.fillStyle = "#fff";
  pipCtx.fillText(vTxt, 94, 29);
  pipCtx.textBaseline = "bottom";
}

// ============ PiP — БЕЗ AWAIT ============
function enterPiP() {
  try {
    if (pipVideo.requestPictureInPicture) {
      pipVideo.requestPictureInPicture()
        .then(() => {
          state.pipActive = true;
          $("rbPiP").classList.add("on");
          toast("📺 PiP включён — можно свернуть Safari");
        })
        .catch(e => {
          toast("PiP не удалось: " + (e.message || "ошибка"));
        });
    } else if (pipVideo.webkitSetPresentationMode) {
      pipVideo.webkitSetPresentationMode("picture-in-picture");
      state.pipActive = true;
      $("rbPiP").classList.add("on");
      toast("📺 PiP включён");
    } else {
      toast("PiP не поддерживается");
    }
  } catch (e) {
    toast("PiP: " + e.message);
  }
}

async function exitPiP() {
  try {
    if (document.pictureInPictureElement) await document.exitPictureInPicture();
    if (pipVideo.webkitSetPresentationMode) pipVideo.webkitSetPresentationMode("inline");
    state.pipActive = false;
    $("rbPiP").classList.remove("on");
    toast("PiP выключен");
  } catch (e) {}
}

pipVideo.addEventListener("leavepictureinpicture", () => {
  state.pipActive = false;
  $("rbPiP").classList.remove("on");
});

let lastChat = 0, lastEv = 0, lastNotify = 0, lastLike = 0,
    lastResident = 0, lastReply = 0;

function loop(now) {
  const dt = (now - lastTick) / 1000;
  lastTick = now;

  const chatInt = Math.max(0.25, 1.5 - state.hype * 1.05) * 1000;
  if (now - lastChat > chatInt) { spawnChat(); lastChat = now; }

  const resInt = (2200 - state.hype * 1400) + Math.random() * 1500;
  if (now - lastResident > resInt) { residentSpam(rnd(RESIDENTS)); lastResident = now; }

  if (now - lastReply > (900 + Math.random()*1800) && Math.random() < 0.4 + state.hype*0.4) {
    residentReply(); lastReply = now;
  }

  if (now - lastEv > (3500 + Math.random()*3500)) {
    (Math.random() < 0.32 + state.hype*0.4 ? bigEvent : smallEvent)();
    lastEv = now;
  }

  if (now - lastNotify > (5000 + Math.random()*5000)) {
    spawnNote(`${rnd(NICKS)} зашёл`, "", "#78c8ff");
    sfx.viewer(); lastNotify = now;
  }

  if (now - lastLike > (600 + Math.random()*1000)) {
    state.likes += ri(3, 25);
    if (state.hype > 0.3) boom(rnd(["❤️","🔥"]), 2);
    lastLike = now;
  }

  updateCounters(dt);
  renderPiP();
  if (state.pipActive && pipVideo.paused) {
    pipVideo.play().catch(()=>{});
  }

  requestAnimationFrame(loop);
}

async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: state.facing, width:{ideal:1280}, height:{ideal:720} },
      audio: false
    });
    const cam = $("cam");
    if (cam.srcObject) cam.srcObject.getTracks().forEach(t => t.stop());
    cam.srcObject = stream;
    await cam.play();
    return true;
  } catch (e) { alert("Не удалось открыть камеру: " + e.message); return false; }
}

async function flipCamera() {
  state.facing = state.facing === "user" ? "environment" : "user";
  toast(state.facing === "user" ? "Фронтальная камера" : "Задняя камера");
  $("cam").style.transform = state.facing === "user" ? "scaleX(-1)" : "none";
  await startCamera();
}

async function toggleScreen() {
  if (state.screenOn) {
    const s = $("screen");
    if (s.srcObject) { s.srcObject.getTracks().forEach(t => t.stop()); s.srcObject = null; }
    s.style.display = "none";
    $("cam").style.display = "block";
    state.screenOn = false;
    document.body.classList.remove("screen-mode");
    $("rbScreen").classList.remove("on");
    toast("Вернулись к камере");
    return;
  }
  try {
    if (!navigator.mediaDevices.getDisplayMedia) {
      toast("На iPhone — используй 📺 PiP + штатную Запись экрана");
      return;
    }
    const stream = await navigator.mediaDevices.getDisplayMedia({ video: true });
    const s = $("screen");
    s.srcObject = stream;
    s.style.display = "block";
    $("cam").style.display = "none";
    state.screenOn = true;
    document.body.classList.add("screen-mode");
    $("rbScreen").classList.add("on");
    toast("Трансляция экрана");
    stream.getVideoTracks()[0].onended = () => { if (state.screenOn) toggleScreen(); };
  } catch (e) { toast("Отменено"); }
}

let recognition = null;
function startMic() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { toast("Браузер не поддерживает распознавание речи"); return false; }
  if (state.micOn) {
    state.micOn = false;
    if (recognition) { try { recognition.stop(); } catch(e){} }
    $("rbMic").classList.remove("on");
    toast("Микрофон выключен"); return true;
  }
  try {
    recognition = new SR();
    recognition.lang = "ru-RU";
    recognition.continuous = true;
    recognition.interimResults = false;
    recognition.onresult = (e) => {
      const last = e.results[e.results.length - 1];
      if (last.isFinal) { const t = last[0].transcript.trim(); if (t) onUserSpoke(t); }
    };
    recognition.onerror = (e) => { if (e.error === "not-allowed") toast("Разреши микрофон"); };
    recognition.onend = () => { if (state.micOn) { try { recognition.start(); } catch(e){} } };
    recognition.start();
    state.micOn = true;
    $("rbMic").classList.add("on");
    toast("Микрофон включён — говори!");
    return true;
  } catch (e) { toast("Ошибка микрофона"); return false; }
}

function pulse(el) {
  el.classList.add("pulse");
  setTimeout(() => el.classList.remove("pulse"), 380);
}

$("rbPiP").addEventListener("click", e => {
  pulse(e.currentTarget);
  if (state.pipActive) exitPiP(); else enterPiP();
});
$("rbFlip").addEventListener("click", e => { pulse(e.currentTarget); flipCamera(); });
$("rbScreen").addEventListener("click", e => { pulse(e.currentTarget); toggleScreen(); });
$("rbMic").addEventListener("click", e => { pulse(e.currentTarget); startMic(); });
$("rbEvent").addEventListener("click", e => { pulse(e.currentTarget); bigEvent(); toast("🔥 Большой ивент!"); });
$("rbMute").addEventListener("click", e => {
  pulse(e.currentTarget);
  state.muted = !state.muted;
  e.currentTarget.textContent = state.muted ? "🔇" : "🔊";
  toast(state.muted ? "Звук выключен" : "Звук включён");
});
$("closeX").addEventListener("click", () => { if (confirm("Закрыть стрим?")) location.reload(); });

$("startBtn").addEventListener("click", async () => {
  initAudio();
  const ok = await startCamera();
  if (!ok) return;

  // Готовим PiP-поток ЗАРАНЕЕ, пока мы ещё в жесте пользователя
  pipStream = pipCanvas.captureStream(30);
  pipVideo.srcObject = pipStream;
  pipVideo.muted = true;
  try { await pipVideo.play(); } catch(e) {}

  try { await navigator.mediaDevices.getUserMedia({ audio: true }); startMic(); } catch (e) {}

  $("start").style.display = "none";
  setTimeout(() => spawnNote("Ты в эфире!", "📺 — PiP, 📱 — экран, 🎤 — речь", "#8cff8c"), 500);
  requestAnimationFrame(loop);
});

document.body.addEventListener("touchstart", initAudio, { once: true });

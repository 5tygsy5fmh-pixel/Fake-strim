function initAudio() {
  if (!audioCtx) {

  if (audioCtx.state === "suspended") audioCtx.resume();
}

function tone(freq, dur, vol=0.25, type="sine", delay=0, slideTo=null) {
  if (state.muted || !audioCtx) return;
  const t0 = audioCtx.currentTime + delay;
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t0);
  if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(g).connect(audioCtx.destination);
  osc.start(t0); osc.stop(t0 + dur + 0.05);
}

function pickReplyFor(prevMsg) {
  if (!prevMsg) return rnd(GENERIC_REPLY);

  if (prevMsg.text.includes("😂") || prevMsg.text.includes("🤡")) return rnd(REPLY_TO_CLOWN);
  return rnd(GENERIC_REPLY);
}

// Реакция: житель отвечает на предыдущее сообщение (иногда другому жителю)
function residentReply() {
  // ищем последнее сообщение от резидента (не старше 4 секунд)
  const now = Date.now();
  const candidates = recentMessages.filter(m =>
    m.isResident && (now - m.time) < 4000
  );
  // если нашли — отвечаем именно им (взаимодействие ботов)
  const target = candidates.length > 0 ? rnd(candidates) : null;
  // выбираем другого резидента (не того, кому отвечаем)
  let responder;
  do { responder = rnd(RESIDENTS); } while (target && responder.nick === target.nick);

  const reply = pickReplyFor(target);
  spawnChat(reply, responder.nick, responder.color, {
    isResident: true, kind: responder.kind, reply: true
  });
  sfxReply();
}

// ============ СОБЫТИЯ СТРИМА ============
function bigEvent() {
  if (Math.random() < 0.55) {
    const [name, color] = rnd(BLOGGERS);
    spawnBanner(`⭐ ${name} зашёл`, "топ-блогер 🎉", color, name);
    spawnNote(`${name} зашёл`, "известный блогер", color);
    sfxBlogger();
    state.tv += ri(4000, 15000);
    state.likes += ri(3000, 9000);
    state.hype = Math.min(1, state.hype + 0.6);
    boom("🔥", 20);
    for (let i=0; i<8; i++) {
      setTimeout(() => spawnChat(rnd([`${name} тут!`,"ооо это же он","го го го 🔥",`${name} привет!`,"легенда!"])), i*120);
    }
    // резиденты реагируют
    setTimeout(() => residentSpam(rnd(RESIDENTS.filter(r=>r.kind==="spam"))), 400);
    setTimeout(() => residentSpam(rnd(RESIDENTS.filter(r=>r.kind==="clown"))), 900);
  } else {
    const d = rnd(DONATORS);
    const a = rnd([1000,2000,5000,10000]);
    const c = rnd(DONATE_COMMENTS);
    spawnBanner(`💎 ${d} → ${a.toLocaleString("ru-RU")} ₽`, c, "#ff50b4", d);
    spawnNote(`${d} +${a.toLocaleString("ru-RU")} ₽`, c, "#ff78c8");
    sfxDonateBig();
    state.coins += a * 10;
    state.tv += ri(1000, 4000);
    state.hype = Math.min(1, state.hype + 0.6);
    boom("💎", 18);
    // резиденты реагируют
    setTimeout(() => spawnChat("вау донат 💎","Lera_Simp","#ff96dc",
      {isResident:true,kind:"simp"}), 500);
    setTimeout(() => spawnChat("дай мне тоже","67_kid","#ff5c5c",
      {isResident:true,kind:"spam"}), 900);
  }
  state.lastEvent = Date.now();
  shake();
}

function smallEvent() {
  const r = Math.random();
  if (r < 0.35) {
    state.likes += ri(80, 500);
    state.hype = Math.min(1, state.hype + 0.08);
    sfxLike();
    boom(rnd(["❤️","🔥","👍"]), 6);
  } else if (r < 0.7) {
    boom(rnd(EMOJIS), ri(4, 9));
    sfxPop();
  } else {
    const d = rnd(DONATORS);
    const a = rnd([50,100,200,500]);
    state.coins += a * 10;
    spawnNote(`${d} +${a} ₽`, rnd(DONATE_COMMENTS), "#ff96dc");
    sfxDonateSmall();
    boom("💎", 5);
  }
  state.lastEvent = Date.now();
}

// ============ ОБНОВЛЕНИЕ СЧЁТЧИКОВ ============
let lastTick = performance.now();
function updateCounters(dt) {
  state.hype = Math.max(0, state.hype - dt * 0.18);
  state.tv += 4 * dt + state.hype * 500 * dt;
  state.viewers += (state.tv - state.viewers) * Math.min(1, dt * 2.2);
  if (Date.now() - state.lastEvent > 15000) state.tv *= (1 - 0.01 * dt);

  viewersEl.textContent = fmt(state.viewers);
  likesEl.textContent = fmt(state.likes);
  coinsEl.textContent = fmt(state.coins);
  hypeEl.style.width = (state.hype * 100) + "%";
}

// ============ ЦИКЛ ============
let lastChat = 0, lastEv = 0, lastNotify = 0, lastLike = 0,
    lastResident = 0, lastReply = 0;

function loop(now) {
  const dt = (now - lastTick) / 1000;
  lastTick = now;

  // Обычный чат
  const chatInterval = Math.max(0.2, 1.4 - state.hype * 1.05) * 1000;
  if (now - lastChat > chatInterval) { spawnChat(); lastChat = now; }

  // РЕЗИДЕНТЫ: спам от постоянных персонажей
  // Чем выше хайп, тем чаще они спамят
  const resInterval = (2000 - state.hype * 1400) + Math.random() * 1500;
  if (now - lastResident > resInterval) {
    const resident = rnd(RESIDENTS);
    residentSpam(resident);
    lastResident = now;
  }

  // ОТВЕТЫ БОТОВ ДРУГ ДРУГУ
  // С вероятностью, зависящей от хайпа — резидент отвечает на чужое сообщение
  const replyChance = 0.4 + state.hype * 0.4;
  if (now - lastReply > (900 + Math.random() * 1800) && Math.random() < replyChance) {
    residentReply();
    lastReply = now;
  }

  // события
  if (now - lastEv > (3000 + Math.random() * 3000)) {
    if (Math.random() < 0.32 + state.hype * 0.4) bigEvent();
    else smallEvent();
    lastEv = now;
  }

  // вход зрителя
  if (now - lastNotify > (5000 + Math.random() * 5000)) {
    const n = rnd(NICKS);
    spawnNote(`${n} зашёл`, "", "#78c8ff");
    sfxViewer();
    lastNotify = now;
  }

  // авто-лайки
  if (now - lastLike > (600 + Math.random() * 1000)) {
    state.likes += ri(3, 25);
    if (state.hype > 0.3) boom(rnd(["❤️","🔥"]), 2);
    lastLike = now;
  }

  updateCounters(dt);
  requestAnimationFrame(loop);
}

// ============ КАМЕРА ============
async function startCamera() {
  const video = document.getElementById("video");
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false
    });
    video.srcObject = stream;
    await video.play();
    return true;
  } catch (err) {
    alert("Не удалось получить доступ к камере: " + err.message +
          "\n\nОткрой ссылку в Safari и разреши камеру.");
    return false;
  }
}

// ============ СТАРТ ============
document.getElementById("startBtn").addEventListener("click", async () => {
  initAudio();
  const ok = await startCamera();
  if (ok) {
    document.getElementById("start").style.display = "none";
    setTimeout(() => {
      spawnNote("Запиши экран iPhone", "Пункт управления → Запись экрана", "#8cff8c");
    }, 800);
    requestAnimationFrame(loop);
  }
});

document.getElementById("btnBig").addEventListener("click", bigEvent);
document.getElementById("btnSmall").addEventListener("click", smallEvent);
document.getElementById("btnMute").addEventListener("click", (e) => {
  state.muted = !state.muted;
  e.target.textContent = state.muted ? "🔇" : "🔊";
});

document.body.addEventListener("touchstart", initAudio, { once: true });
document.body.addEventListener("click", initAudio, { once: true });
</script>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>LIVE</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { width:100%; height:100%; overflow:hidden; background:#000;
  font-family:-apple-system,"Segoe UI",Roboto,sans-serif; color:#fff;
  user-select:none; -webkit-user-select:none; position:fixed; }

#cam, #screen {
  position:fixed; top:0; left:0;
  width:100vw; height:100vh;
  object-fit:cover; -webkit-object-fit:cover;
  object-position:center center;
  background:#000; z-index:1;
}
#cam { transform:scaleX(-1); }
#screen { display:none; }
#ui { position:fixed; inset:0; z-index:2; pointer-events:none; }

#island { position:absolute; top:calc(8px + env(safe-area-inset-top)); left:50%;
  transform:translateX(-50%) scale(.5); opacity:0; pointer-events:none;
  display:flex; align-items:center; gap:8px; background:#000; color:#fff;
  border-radius:22px; padding:4px 12px 4px 4px; height:34px; z-index:5;
  box-shadow:0 6px 20px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.08);
  transition:opacity .25s, transform .35s cubic-bezier(.2,1.3,.4,1); }
#islandCam { width:26px; height:26px; border-radius:50%; object-fit:cover;
  background:#1a1a1a; transform:scaleX(-1); }
.island-info { display:flex; align-items:center; gap:6px; }
.island-dot { width:8px; height:8px; border-radius:50%; background:#ff3838;
  box-shadow:0 0 8px #ff3838; animation:dotPulse 1.4s ease-in-out infinite; }
@keyframes dotPulse { 0%,100%{opacity:1; transform:scale(1);} 50%{opacity:.35; transform:scale(.85);} }
.island-txt { font-size:11px; font-weight:800; letter-spacing:.6px; }

.top { position:absolute; top:0; left:0; right:0; padding:12px 12px 40px;
  padding-top:calc(12px + env(safe-area-inset-top));
  background:linear-gradient(180deg,rgba(0,0,0,.65) 0%,rgba(0,0,0,0) 100%);
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  z-index:10; }
.host { display:flex; align-items:center; gap:8px; min-width:0; }
.host-av { width:36px; height:36px; border-radius:50%; flex:0 0 36px;
  background:#e8e0d8; overflow:hidden;
  box-shadow:0 0 0 2px rgba(255,255,255,.6); }
.host-av svg { width:100%; height:100%; display:block; }
.host-name { font-size:14px; font-weight:700; max-width:110px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.verified { width:13px; height:13px; border-radius:50%; background:#20a8f0;
  display:inline-flex; align-items:center; justify-content:center;
  font-size:8px; font-weight:800; flex:0 0 13px; }
.chev { opacity:.7; font-size:10px; }
.top-right { display:flex; align-items:center; gap:8px; }
.live-badge { background:#ff2850; padding:3px 7px; border-radius:4px;
  font-size:11px; font-weight:800; letter-spacing:.5px; }
.viewers { display:flex; align-items:center; gap:5px;
  background:rgba(0,0,0,.5); padding:4px 8px; border-radius:5px;
  font-size:12px; font-weight:700; }
.viewers svg { width:14px; height:14px; }
.close-x { width:28px; height:28px; display:flex; align-items:center;
  justify-content:center; pointer-events:auto; cursor:pointer; }
.close-x svg { width:22px; height:22px; }

.rail { position:absolute; right:6px; bottom:auto; top:22%;
  display:flex; flex-direction:column; gap:16px; align-items:center;
  pointer-events:auto; z-index:9; }
.rb { width:40px; height:40px; display:flex; align-items:center;
  justify-content:center; cursor:pointer; position:relative;
  transition:transform .12s cubic-bezier(.2,1.4,.4,1); }
.rb:active { transform:scale(.82); }
.rb svg { width:28px; height:28px; display:block;
  filter:drop-shadow(0 2px 5px rgba(0,0,0,.75)); }
.rb.red-active.on svg path, .rb.red-active.on svg circle,
.rb.red-active.on svg rect, .rb.red-active.on svg polyline,
.rb.red-active.on svg line { stroke:#ff2850 !important; }
.rb.pulse { animation:rpls .35s ease-out; }
@keyframes rpls { 0%{transform:scale(1);} 50%{transform:scale(1.2);} 100%{transform:scale(1);} }

.rail-av { position:relative; margin-bottom:6px; }
.rail-av .host-av { width:42px; height:42px; flex:0 0 42px;
  box-shadow:0 0 0 2px #fff; }
.rail-av .plus { position:absolute; bottom:-6px; left:50%;
  transform:translateX(-50%); width:18px; height:18px;
  background:#ff2850; border-radius:50%; display:flex;
  align-items:center; justify-content:center; font-size:13px;
  font-weight:800; color:#fff; border:2px solid #000; }

.comments { position:absolute; left:12px; right:80px; bottom:110px;
  max-height:50%; overflow:hidden; display:flex; flex-direction:column;
  justify-content:flex-end; gap:7px; transition:all .35s ease;
  z-index:3; }
.cm { display:flex; align-items:flex-start; gap:8px; background:rgba(0,0,0,.42);
  backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  padding:7px 12px 7px 8px; border-radius:20px; max-width:100%;
  animation:cmin .28s ease-out; }
.cm.reply { margin-left:26px; background:rgba(0,0,0,.55); }
@keyframes cmin { from{opacity:0; transform:translateY(12px);} to{opacity:1;} }
.cm-av { flex:0 0 26px; width:26px; height:26px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:15px; line-height:1; }
.cm-body { flex:1; min-width:0; }
.cm-nick { font-size:11px; opacity:.75; margin-bottom:1px; }
.cm-text { font-size:13px; line-height:1.3; word-break:break-word; }

body.banner-show .comments { opacity:0; transform:translateY(20px); }

.caption { position:absolute; left:16px; right:80px; bottom:56px;
  text-align:center; font-size:17px; font-weight:800; padding:10px 16px;
  background:rgba(0,0,0,.72); border-radius:14px; display:none;
  backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  animation:capIn .15s ease-out; line-height:1.3;
  text-shadow:0 1px 3px rgba(0,0,0,.8); z-index:4; }
.caption.interim { opacity:.75; font-style:italic; }
@keyframes capIn { from{opacity:0; transform:translateY(6px);} to{opacity:1;} }

.hearts { position:absolute; right:20px; bottom:auto; top:60%;
  width:60px; height:40vh; overflow:visible; pointer-events:none;
  z-index:3; }
.heart { position:absolute; bottom:0; font-size:26px;
  will-change:transform,opacity; }

.notes { position:absolute; top:80px; left:12px; right:12px;
  display:flex; flex-direction:column; gap:6px;
  align-items:flex-start; z-index:8; }
.note { background:linear-gradient(135deg, rgba(0,0,0,.85), rgba(40,10,60,.85));
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  padding:10px 14px; border-radius:14px; font-size:13px;
  border:1px solid rgba(255,255,255,.15);
  animation:ntin .4s cubic-bezier(.2,1.3,.4,1); max-width:calc(100% - 80px); }
.note b { display:block; font-size:14px; margin-bottom:2px; }
.note small { opacity:.85; font-size:12px; }
.note.donate b { color:#ff96dc; }
.note.sub b { color:#8cff8c; }
.note.donate { border-left:3px solid #ff50b4; }
.note.sub { border-left:3px solid #8cff8c; }
@keyframes ntin { from{transform:translateX(-30px) scale(.9); opacity:0;}
  to{transform:none; opacity:1;} }

.banner { position:absolute; top:24%; left:16px; right:16px;
  padding:22px 20px; border-radius:20px;
  background:linear-gradient(135deg, rgba(20,10,30,.98), rgba(40,10,60,.98));
  backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  border:2px solid #fff; box-shadow:0 8px 60px rgba(255,200,80,.5);
  display:none; animation:bnin .5s cubic-bezier(.2,1.3,.4,1);
  text-align:center; z-index:50; }
.banner .b-nick { font-size:15px; font-weight:600; margin-bottom:8px;
  opacity:.85; }
.banner .b-amount { font-size:32px; font-weight:900;
  margin-bottom:10px; letter-spacing:-.5px; }
.banner .b-text { font-size:15px; opacity:.95; line-height:1.45;
  font-weight:500; }
@keyframes bnin {
  0%{transform:scale(.5); opacity:0;}
  60%{transform:scale(1.05); opacity:1;}
  100%{transform:scale(1);}
}

#start { position:fixed; inset:0; z-index:40; background:#0a0a14;
  display:flex; flex-direction:column; align-items:center;
  justify-content:center; padding:30px; text-align:center; }
#start h1 { font-size:24px; margin-bottom:14px; }
#start p { font-size:14px; opacity:.8; margin-bottom:24px; line-height:1.5; }
#start button { background:#ff2850; color:#fff; border:none;
  padding:16px 34px; border-radius:30px; font-size:16px; font-weight:700; }

.toast { position:absolute; bottom:200px; left:50%; transform:translateX(-50%);
  background:rgba(255,255,255,.18);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  padding:8px 16px; border-radius:20px; font-size:12px;
  opacity:0; transition:opacity .3s; pointer-events:none; white-space:nowrap;
  z-index:6; max-width:80%; text-align:center; }
.toast.show { opacity:1; }

.shake { animation:shk .4s; }
@keyframes shk { 0%,100%{transform:none;} 20%{transform:translate(-3px,2px);} 40%{transform:translate(3px,-2px);} 60%{transform:translate(-2px,-1px);} 80%{transform:translate(2px,1px);} }

.rec-badge { position:absolute; top:calc(12px + env(safe-area-inset-top));
  left:50%; transform:translateX(-50%); display:none;
  background:rgba(0,0,0,.75); padding:5px 12px; border-radius:16px;
  font-size:12px; font-weight:800; color:#fff; z-index:60;
  align-items:center; gap:6px;
  backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); }
.rec-badge.show { display:flex; }
.rec-badge .dot { width:8px; height:8px; border-radius:50%; background:#ff3838;
  animation:dotPulse 1.2s ease-in-out infinite; }
</style>
</head>

<div id="start">

  emojisOn: true, facing: "user",

// ============ АВАТАРКА GRAND-CAT (майнкрафт-кот с алмазом) ============
const HOST_AVATAR_SVG = `

// ============ ГЕНЕРАТОР НИКОВ ============
const NICK_PRE = ["dark","pro","mega","ultra","super","tiny","angry","happy",
  "sleepy","hungry","epic","cool","bad","best","real","cyber","neo","pixel",
  "retro","cosmic","alpha","beta","omega","night","day","moon","sun","star",
  "shadow","light","fire","ice","storm","thunder","sneaky","silent","crazy",
  "wild","lazy","fuzzy","fluffy","chill","mad","slick","swift","lucky","happy",
  "sad","lonely","brave","mighty","lil","big","small","young","old","sweet",
  "sour","spicy","chilly","warm","frost","blaze","aqua","terra","wind","sand",
  "snow","rain","mist","cloud","dusk","dawn","horizon","galaxy","comet","nova"];

const NICK_ROOT = ["cat","wolf","fox","dragon","ninja","hacker","gamer","player",
  "boy","girl","kid","dude","bro","guy","friend","legend","master","boss",
  "king","queen","lord","knight","mage","witch","ghost","demon","angel",
  "robot","bot","troll","panda","tiger","lion","bear","puppy","kitten",
  "star","vibe","soul","spirit","reaper","hunter","rider","walker","seeker",
  "sniper","warrior","samurai","viking","pirate","cowboy","alien","zombie",
  "vampire","dwarf","elf","orc","goblin","titan","phoenix","pegasus","sphinx"];

const NICK_SUF = ["", "", "", "", "01","07","13","22","47","69","77","88","99",
  "100","123","2000","2020","2024","228","333","420","555","666","777","888",
  "999","xX","Xx","YT","TV","GG","OP","PRO","TOP","GOD"];

const usedNicks = new Set();
function randomNick() {
  for (let i = 0; i < 60; i++) {
    const r = Math.random();
    let nick;
    if (r < 0.28) {
      nick = rnd(NICK_PRE) + "_" + rnd(NICK_ROOT);
    } else if (r < 0.50) {
      nick = rnd(NICK_ROOT) + "_" + rnd(NICK_SUF.filter(s => s));
    } else if (r < 0.68) {
      nick = "xX_" + rnd(NICK_ROOT) + "_Xx";
    } else if (r < 0.82) {
      nick = rnd(NICK_PRE) + rnd(NICK_ROOT) + ri(1, 999);
    } else if (r < 0.92) {
      nick = rnd(NICK_ROOT) + ri(1, 99);
    } else {
      nick = rnd(NICK_PRE).toUpperCase() + rnd(NICK_ROOT).toUpperCase();
    }
    if (!usedNicks.has(nick)) {
      usedNicks.add(nick);
      return nick;
    }
  }
  return "user" + ri(1000, 99999);
}

// ============ ГЕНЕРАТОР АВАТАРОК ============

const recentMessages = [];
function rememberMessage(m) {
  recentMessages.push(m);

}
function setTopic(theme) {
  if (!theme) return;
  currentTopic = { name:theme.name, replies:theme.replies, expires: Date.now() + 25000 };
}
function detectThemes(text) {
  const t = (text||"").toLowerCase();
  const found = [];
  for (const th of THEMES) if (th.keys.some(k => t.includes(k))) found.push(th);
  return found;
}
function pickEmoji() {
  if (currentTopic && Date.now() < currentTopic.expires
      && EMOJIS_BY_THEME[currentTopic.name]) {
    return rnd(EMOJIS_BY_THEME[currentTopic.name]);
  }
  return rnd(EMOJIS_ALL);
}

let audioCtx = null;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === "suspended") audioCtx.resume();
}
function tone(freq, dur, vol=0.25, type="sine", delay=0, slideTo=null) {
  if (state.muted || !audioCtx) return;
  const t0 = audioCtx.currentTime + delay;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t0);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0+dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  o.connect(g).connect(audioCtx.destination);
  o.start(t0); o.stop(t0+dur+0.05);
}

function spawnChat(text=null, nick=null, color=null, opts={}) {
  // Генерируем уникальные ник и аватар если не переданы явно
  const isResident = !!opts.isResident;
  if (!nick && !isResident) nick = randomNick();
  if (!nick) nick = rnd(RESIDENTS).nick;
  if (!color && !isResident) color = rnd(AVATAR_COLORS);
  if (!color) color = "#ff6384";

  if (text === null) {
    if (currentTopic && Date.now() < currentTopic.expires && Math.random() < 0.75) {
      text = rnd(currentTopic.replies);
    } else {
      const prevRes = recentMessages.filter(m => m.isResident).slice(-1)[0];
      if (prevRes && Math.random() < 0.5) {
        text = pickReplyFor(prevRes); opts.reply = true;
      } else {
        text = rnd(GENERIC_CHAT);
      }
    }
  }

  // Аватарка: у резидентов — буква, у обычных — случайный эмодзи+градиент
  let avHTML;
  if (isResident) {
    avHTML = `<div class="cm-av" style="background:${color}">${nick[0].toUpperCase()}</div>`;
  } else {
    const av = randomAvatar();
    avHTML = `<div class="cm-av" style="background:${av.gradient}">${av.emoji}</div>`;
  }

  const el = document.createElement("div");
  el.className = "cm" + (opts.reply ? " reply" : "");
  el.innerHTML = `
    ${avHTML}
    <div class="cm-body">
      <div class="cm-nick" style="color:${color}">${nick}</div>
      <div class="cm-text">${text}</div>
    </div>`;
  commentsEl.appendChild(el);
  while (commentsEl.children.length > 22) commentsEl.removeChild(commentsEl.firstChild);
  setTimeout(() => { if (el.parentNode) el.remove(); }, 13000);
  pipAdd(nick, text, color, !!opts.reply);
  rememberMessage({ nick, text, time:Date.now(), isResident, kind:opts.kind || null });
  if (!isResident) markActivity();
}

  if (!prev) return rnd(GENERIC_CHAT);
  if (prev.kind === "spam")  return rnd(REPLY_TO_SPAM);
  if (prev.kind === "hater") return rnd(REPLY_TO_HATE);
  if (prev.kind === "simp")  return rnd(REPLY_TO_SIMP);
  if (prev.kind === "clown") return rnd(REPLY_TO_CLOWN);

  if (prev.text.includes("😂") || prev.text.includes("🤡")) return rnd(REPLY_TO_CLOWN);

let lastTick = performance.now();
function updateCounters(dt) {
  state.hype = Math.max(0, state.hype - dt*0.18);
  const idleTime = (Date.now() - state.lastActivity) / 1000;
  if (idleTime < 12) {
    state.tv += 28 * dt;
  } else {
    state.tv -= 15 * dt;
    if (state.tv < 300) state.tv = 300;
  }
  state.viewers += (state.tv - state.viewers) * Math.min(1, dt * 1.5);
  const v = state.viewers;
  let label;
  if (v >= 1000000) label = (v/1000000).toFixed(1) + "M";
  else if (v >= 1000) label = (v/1000).toFixed(1) + "K";
  else label = Math.floor(v);
  $("viewers").textContent = label;
}

const pipCanvas = document.createElement("canvas");
pipCanvas.width = 540; pipCanvas.height = 960;
const pipCtx = pipCanvas.getContext("2d");
const pipVideo = $("pipVideo");
let pipStream = null;
const pipHistory = [];
let pipCaption = "";

function pipAdd(nick, text, color, isReply) {
  pipHistory.push({ nick, text, color, isReply, t: Date.now() });
  while (pipHistory.length > 12) pipHistory.shift();
}

function drawCovered(ctx, video, W, H, mirror) {
  if (!video || video.readyState < 2 || !video.videoWidth) return;
  const vw = video.videoWidth, vh = video.videoHeight;
  const scale = Math.max(W/vw, H/vh);
  const dw = vw*scale, dh = vh*scale;
  const dx = (W-dw)/2, dy = (H-dh)/2;
  if (mirror) {
    ctx.save(); ctx.translate(W, 0); ctx.scale(-1, 1);
    ctx.drawImage(video, W-dx-dw, dy, dw, dh); ctx.restore();
  } else ctx.drawImage(video, dx, dy, dw, dh);
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

function renderPiP() {
  const W = pipCanvas.width, H = pipCanvas.height;
  const videoH = Math.floor(H * 0.60);
  const captionH = 60;
  const chatH = H - videoH - captionH;

  pipCtx.fillStyle = "#000";
  pipCtx.fillRect(0, 0, W, H);

  const cam = $("cam");
  drawCovered(pipCtx, cam, W, videoH, state.facing === "user");

  pipCtx.fillStyle = "#0a0a0a";
  pipCtx.fillRect(0, videoH, W, captionH);
  if (pipCaption) {
    pipCtx.fillStyle = "#fff";
    pipCtx.font = "700 22px -apple-system,sans-serif";
    pipCtx.textAlign = "center";
    pipCtx.textBaseline = "middle";
    let t = pipCaption;
    const maxW = W - 40;
    while (pipCtx.measureText(t).width > maxW && t.length > 1) {
      t = t.slice(0, -1);
    }
    pipCtx.fillText(t, W/2, videoH + captionH/2);
  }

  pipCtx.fillStyle = "#000";
  pipCtx.fillRect(0, videoH + captionH, W, chatH);
  pipCtx.fillStyle = "rgba(255,255,255,.15)";
  pipCtx.fillRect(0, videoH + captionH, W, 2);
  pipCtx.fillRect(0, videoH, W, 1);

  const now = Date.now();
  const items = pipHistory.filter(m => now - m.t < 15000).slice(-6);
  pipCtx.textBaseline = "middle";
  pipCtx.textAlign = "left";
  let y = videoH + captionH + 26;
  const lineH = 38;
  for (let i = items.length - 1; i >= 0; i--) {
    const m = items[i];
    const size = 19;
    pipCtx.font = `700 ${size}px -apple-system,sans-serif`;
    const nickW = pipCtx.measureText(m.nick + ": ").width;
    let finalText = m.text;
    const maxW = W - 60 - nickW;
    pipCtx.font = `500 ${size}px -apple-system,sans-serif`;
    while (pipCtx.measureText(finalText).width > maxW && finalText.length > 1) {
      finalText = finalText.slice(0, -1);
    }
    pipCtx.fillStyle = m.color || "#fff";
    pipCtx.font = `700 ${size}px -apple-system,sans-serif`;
    const x = m.isReply ? 30 : 16;
    pipCtx.fillText(m.nick + ":", x, y);
    pipCtx.fillStyle = "#f0f0f0";
    pipCtx.font = `500 ${size}px -apple-system,sans-serif`;
    pipCtx.fillText(finalText, x + nickW, y);
    y += lineH;
    if (y > H - 10) break;
  }

  pipCtx.fillStyle = "#ff2850";
  roundRect(pipCtx, 14, 14, 58, 26, 6);
  pipCtx.fill();
  pipCtx.fillStyle = "#fff";
  pipCtx.font = "800 14px -apple-system,sans-serif";
  pipCtx.textAlign = "left";
  pipCtx.fillText("LIVE", 26, 28);

  pipCtx.fillStyle = "rgba(0,0,0,.55)";
  const v = state.viewers;
  const vTxt = v >= 1000000 ? (v/1000000).toFixed(1) + "M"
             : v >= 1000 ? (v/1000).toFixed(1) + "K"
             : Math.floor(v);
  pipCtx.font = "700 14px -apple-system,sans-serif";
  const vw2 = pipCtx.measureText(vTxt).width + 34;
  roundRect(pipCtx, 80, 14, vw2, 26, 6);
  pipCtx.fill();
  pipCtx.strokeStyle = "#fff"; pipCtx.lineWidth = 1.8;
  pipCtx.beginPath();
  pipCtx.ellipse(92, 27, 8, 5, 0, 0, Math.PI*2);
  pipCtx.stroke();
  pipCtx.beginPath(); pipCtx.arc(92, 27, 2, 0, Math.PI*2); pipCtx.stroke();
  pipCtx.fillStyle = "#fff";
  pipCtx.fillText(vTxt, 104, 28);
}

function enterPiP() {
  try {
    if (pipVideo.requestPictureInPicture) {
      pipVideo.requestPictureInPicture()
        .then(() => { state.pipActive = true; $("rbPiP").classList.add("on");
          toast("📺 PiP включён"); })
        .catch(e => toast("PiP не удалось: " + (e.message || "ошибка")));
    } else if (pipVideo.webkitSetPresentationMode) {
      pipVideo.webkitSetPresentationMode("picture-in-picture");
      state.pipActive = true; $("rbPiP").classList.add("on");
      toast("📺 PiP включён");
    } else toast("PiP не поддерживается");
  } catch (e) { toast("PiP: " + e.message); }
}

async function exitPiP() {
  try {
    if (document.pictureInPictureElement) await document.exitPictureInPicture();
    if (pipVideo.webkitSetPresentationMode) pipVideo.webkitSetPresentationMode("inline");
    state.pipActive = false; $("rbPiP").classList.remove("on");
    toast("PiP выключен");
  } catch (e) {}
}
pipVideo.addEventListener("leavepictureinpicture", () => {
  state.pipActive = false; $("rbPiP").classList.remove("on");
});

// ============ ЗАПИСЬ ============
let mediaRecorder = null;
let recChunks = [];

function startRecording() {
  try {
    const stream = pipCanvas.captureStream(30);
    let mime = "";
    const tries = ["video/mp4;codecs=h264","video/mp4",
                   "video/webm;codecs=vp9","video/webm;codecs=vp8","video/webm"];
    for (const t of tries) {
      if (window.MediaRecorder && MediaRecorder.isTypeSupported(t)) { mime = t; break; }
    }
    mediaRecorder = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
    recChunks = [];
    mediaRecorder.ondataavailable = (e) => {
      if (e.data && e.data.size > 0) recChunks.push(e.data);
    };
    mediaRecorder.onstop = () => {
      try {
        const type = mediaRecorder.mimeType || "video/webm";
        const blob = new Blob(recChunks, { type });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        const ext = type.includes("mp4") ? "mp4" : "webm";
        const stamp = new Date().toISOString().replace(/[:.]/g,"-").slice(0,19);
        a.href = url;
        a.download = `grand-cat-${stamp}.${ext}`;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 15000);
        toast("💾 Видео сохранено");
      } catch (err) { toast("Ошибка сохранения: " + err.message); }
    };
    mediaRecorder.start(1000);
    state.isRecording = true;
    $("recDot").style.display = "block";
    $("recBadge").classList.add("show");
    toast("🔴 Запись начата");
  } catch (e) { toast("Ошибка записи: " + (e.message || "недоступно")); }
}

function stopRecording() {
  try {
    if (mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop();
  } catch (e) {}
  state.isRecording = false;
  $("recDot").style.display = "none";
  $("recBadge").classList.remove("show");
}

function toggleRecording() {
  if (state.isRecording) stopRecording(); else startRecording();
}

let lastChat=0, lastEv=0, lastNotify=0, lastResident=0, lastAutoEmoji=0;
const donationCooldown = 60000;
const subCooldown = 45000;

function loop(now) {
  const dt = (now - lastTick) / 1000;
  lastTick = now;

  const chatInt = Math.max(0.8, 2.2 - state.hype * 1.2) * 1000;
  if (now - lastChat > chatInt) { spawnChat(); lastChat = now; }

  const resInt = (3500 - state.hype * 1500) + Math.random() * 1500;
  if (now - lastResident > resInt) { residentSpam(rnd(RESIDENTS)); lastResident = now; }

  if (now - lastEv > donationCooldown + Math.random()*20000) {
    donationEvent(); lastEv = now;
  }
  if (now - lastNotify > subCooldown + Math.random()*20000) {
    subscriptionEvent(); lastNotify = now;
  }

  if (state.emojisOn) {
    const autoInt = 700 + Math.random() * 900;
    if (now - lastAutoEmoji > autoInt) {
      const batch = ri(1, 3);
      boom(pickEmoji(), batch);
      lastAutoEmoji = now;
    }
  }

  updateCounters(dt);
  renderPiP();
  if (state.pipActive && pipVideo.paused) pipVideo.play().catch(()=>{});
  requestAnimationFrame(loop);
}

async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: state.facing, width:{ideal:1280}, height:{ideal:720} },
      audio: false
    });
    const cam = $("cam");
    if (cam.srcObject) cam.srcObject.getTracks().forEach(t => t.stop());
    cam.srcObject = stream;
    await cam.play();
    return true;
  } catch (e) { alert("Не удалось открыть камеру: " + e.message); return false; }
}

async function flipCamera() {
  state.facing = state.facing === "user" ? "environment" : "user";
  toast(state.facing === "user" ? "Фронтальная камера" : "Задняя камера");
  $("cam").style.transform = state.facing === "user" ? "scaleX(-1)" : "none";
  await startCamera();
}

let recognition = null;
let micRunning = false;

function startMicAuto() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { toast("Распознавание речи не поддерживается"); return; }
  if (micRunning) return;
  try {
    recognition = new SR();
    recognition.lang = "ru-RU";
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.onresult = (e) => {
      let interim = "", final = "";
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const t = e.results[i][0].transcript;
        if (e.results[i].isFinal) final += t;
        else interim += t;
      }
      if (state.micMuted) return;
      if (interim) { showCaption(interim, true); pipCaption = interim; }
      if (final) {
        showCaption(final, false);
        pipCaption = final;
        onUserSpoke(final.trim());
        setTimeout(() => { if (pipCaption === final) pipCaption = ""; }, 2500);
      }
    };
    recognition.onerror = (e) => {
      if (e.error === "not-allowed") toast("Разреши микрофон");
    };
    recognition.onend = () => {
      if (state.micOn && !state.micMuted) {
        micRunning = false;
        setTimeout(() => { if (state.micOn && !state.micMuted) startMicAuto(); }, 300);
      } else {
        micRunning = false;
      }
    };
    recognition.start();
    micRunning = true;
    state.micOn = true;
    $("micSlash").style.display = "none";
  } catch (e) { console.error(e); }
}

function toggleMic() {
  if (!state.micMuted) {
    state.micMuted = true;
    $("micSlash").style.display = "block";
    toast("🔇 Микрофон выключен");
    captionEl.style.display = "none";
    pipCaption = "";
  } else {
    state.micMuted = false;
    $("micSlash").style.display = "none";
    toast("🎤 Микрофон включён");
    if (!micRunning) startMicAuto();
  }
}

function toggleEmojis() {
  state.emojisOn = !state.emojisOn;
  if (state.emojisOn) {
    $("emojiSlash").style.display = "none";
    $("rbEmoji").classList.add("on");
  } else {
    $("emojiSlash").style.display = "block";
    $("rbEmoji").classList.remove("on");
  }
}

function pulse(el) {
  el.classList.add("pulse");
  setTimeout(() => el.classList.remove("pulse"), 380);
}

$("rbRec").addEventListener("click", e => { pulse(e.currentTarget); toggleRecording(); });
$("rbFlip").addEventListener("click", e => { pulse(e.currentTarget); flipCamera(); });
$("rbMic").addEventListener("click", e => { pulse(e.currentTarget); toggleMic(); });
$("rbEmoji").addEventListener("click", e => { pulse(e.currentTarget); toggleEmojis(); });
$("rbPiP").addEventListener("click", e => {
  pulse(e.currentTarget);
  if (state.pipActive) exitPiP(); else enterPiP();
});
$("closeX").addEventListener("click", () => { if (confirm("Закрыть стрим?")) location.reload(); });

// Устанавливаем SVG аватарки grand-cat
$("hostAvTop").innerHTML = HOST_AVATAR_SVG;
$("hostAvRail").innerHTML = HOST_AVATAR_SVG;

$("startBtn").addEventListener("click", async () => {
  initAudio();
  const ok = await startCamera();
  if (!ok) return;
  pipStream = pipCanvas.captureStream(30);
  pipVideo.srcObject = pipStream;
  pipVideo.muted = true;
  try { await pipVideo.play(); } catch(e) {}
  try {
    await navigator.mediaDevices.getUserMedia({ audio: true });
    startMicAuto();
  } catch (e) {}
  $("start").style.display = "none";
  setTimeout(() => spawnNote("grand-cat в эфире!", "🔴 — запись, 🎤 — мьют", "#8cff8c", "sub"), 500);
  requestAnimationFrame(loop);
});

document.body.addEventListener("touchstart", initAudio, { once: true });

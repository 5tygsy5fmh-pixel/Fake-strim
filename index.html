                       tone(784,0.55,0.10,"sine",0.05); },

  pop:         () => { tone(1800,0.04,0.14,"square"); tone(900,0.06,0.10); },
  like:        () => tone(1500,0.05,0.10,"triangle"),
  reply:       () => { tone(1300,0.05,0.08,"triangle"); tone(1700,0.06,0.07,"triangle",0.05); },
};

// ============ DOM ============
const $ = id => document.getElementById(id);
const commentsEl = $("comments"), notesEl = $("notes"), bannerEl = $("banner"),
      heartsEl = $("hearts"), captionEl = $("caption"), toastEl = $("toast");
const fmt = n => Math.floor(n).toLocaleString("ru-RU").replace(/,/g," ");

function toast(text) {
  toastEl.textContent = text;
  toastEl.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => toastEl.classList.remove("show"), 1800);
}

// ============ ЧАТ ============
function spawnChat(text=null, nick=null, color=null, opts={}) {
  nick = nick || rnd(NICKS);
  if (text === null) {
    const r = Math.random();
    text = r < 0.55 ? rnd(COMPLIMENTS) : r < 0.85 ? rnd(REACTIONS) : rnd(QUESTIONS);
  }
  color = color || rnd(COLORS);
  const el = document.createElement("div");
  el.className = "cm" + (opts.reply ? " reply" : "");
  el.innerHTML = `
    <div class="cm-av" style="background:${color}">${nick[0].toUpperCase()}</div>
    <div class="cm-body">
      <div class="cm-nick">${nick}</div>
      <div class="cm-text">${text}</div>
    </div>`;
  commentsEl.appendChild(el);
  while (commentsEl.children.length > 22) commentsEl.removeChild(commentsEl.firstChild);
  // в режиме экрана — скроллим вниз
  if (document.body.classList.contains("screen-mode")) {
    commentsEl.scrollTop = commentsEl.scrollHeight;
  }
  setTimeout(() => { if (el.parentNode) el.remove(); }, 13000);

  rememberMessage({ nick, text, time:Date.now(),
    isResident:!!opts.isResident, kind:opts.kind || null });
}

function spawnNote(text, sub="", color="#ffd700") {
  const el = document.createElement("div");
  el.className = "note";
  el.style.borderLeftColor = color;
  el.innerHTML = `<b style="color:${color}">${text}</b>${sub ? `<small>${sub}</small>` : ""}`;
  notesEl.appendChild(el);
  setTimeout(() => { if (el.parentNode) el.remove(); }, 4500);
}

function spawnBanner(text, sub, color, nick) {
  bannerEl.innerHTML = `
    <div class="t" style="color:${color}">${text}</div>
    ${sub ? `<div class="s">${sub}</div>` : ""}
    ${nick ? `<div class="n" style="color:${color}">${nick}</div>` : ""}`;
  bannerEl.style.borderColor = color;
  bannerEl.style.boxShadow = `0 0 40px ${color}66`;
  bannerEl.style.display = "block";
  clearTimeout(spawnBanner._t);
  spawnBanner._t = setTimeout(() => { bannerEl.style.display = "none"; }, 4000);
}

function boom(emoji, count=16) {
  for (let i=0; i<count; i++) {
    const el = document.createElement("div");
    el.className = "heart";
    el.textContent = emoji;
    el.style.right = (Math.random()*40) + "px";
    el.style.left = "auto";
    el.style.fontSize = ri(20,34) + "px";
    heartsEl.appendChild(el);
    const vx = (Math.random()-0.5)*30;
    const vy = document.body.classList.contains("screen-mode") ? ri(220, 400) : -ri(220, 400);
    el.animate([
      { transform:"translate(0,0)", opacity:1 },
      { transform:`translate(${vx}px,${vy}px)`, opacity:0 }
    ], { duration: ri(1500,2400), easing:"ease-out" })
    .onfinish = () => el.remove();
  }
}

function shakeUI() {
  const ui = document.getElementById("ui");
  ui.classList.add("shake");
  setTimeout(() => ui.classList.remove("shake"), 420);
}

// ============ РЕАКЦИИ ============
const REPLY_TO_SPAM     = ["67 67 67","67 топ","сам 67","67???","да 67","67 навсегда",
  "хватит спамить","забаньте его","опять этот 67","67 уже в печёнках","😂 67 снова"];
const REPLY_TO_HATE     = ["сам такой","не нравится — выйди","хейтер детектед",
  "завидуй молча","а ты кто такой?","лох сам","ахахах хейтер","слабая попытка"];
const REPLY_TO_SIMP     = ["фууу","кринж","иди отсюда","😂😂😂","simp детектед",
  "он тебя не заметит","хахах simp","кринжово"];
const REPLY_TO_QUESTION = ["а сам как думаешь?","он говорил уже","перемотай стрим",
  "загугли","ну ты и спросил","очевидно же","он уже отвечал 5 раз"];
const REPLY_TO_CLOWN    = ["😂😂😂","я тоже ору","жиза","ахахах","ты жжёшь","ору с тебя"];
const GENERIC_REPLY     = ["согласен","база","ну да","это точно","плюсую",
  "жиза братан","ты прав","реально","+1","💯","вот это да"];

function pickReplyFor(prev) {
  if (!prev) return rnd(GENERIC_REPLY);
  if (prev.kind === "spam")     return rnd(REPLY_TO_SPAM);
  if (prev.kind === "hater")    return rnd(REPLY_TO_HATE);
  if (prev.kind === "simp")     return rnd(REPLY_TO_SIMP);
  if (prev.kind === "asker")    return rnd(REPLY_TO_QUESTION);
  if (prev.kind === "clown")    return rnd(REPLY_TO_CLOWN);
  const t = (prev.text||"").toLowerCase();
  if (t.includes("67") || t.includes("скибиди")) return rnd(REPLY_TO_SPAM);
  if (/\?$/.test(prev.text)) return rnd(REPLY_TO_QUESTION);
  if (prev.text.includes("😂") || prev.text.includes("🤡")) return rnd(REPLY_TO_CLOWN);
  return rnd(GENERIC_REPLY);
}

function residentReply() {
  const now = Date.now();
  const candidates = recentMessages.filter(m => m.isResident && (now - m.time) < 4500);
  const target = candidates.length > 0 ? rnd(candidates) : null;
  let responder;
  do { responder = rnd(RESIDENTS); } while (target && responder.nick === target.nick);
  spawnChat(pickReplyFor(target), responder.nick, responder.color,
    { isResident:true, kind:responder.kind, reply:true });
  sfx.reply();
}

function residentSpam(resident) {
  spawnChat(rnd(resident.lines), resident.nick, resident.color,
    { isResident:true, kind:resident.kind });
}

// ============ РЕЧЬ ============
function detectThemes(text) {
  const t = (text||"").toLowerCase();
  const found = [];
  for (const th of THEMES) {
    if (th.keys.some(k => t.includes(k))) found.push(th);
  }
  return found;
}

function onUserSpoke(text) {
  if (!text || text.trim().length < 2) return;
  state.lastHeard = text;
  captionEl.textContent = text;
  captionEl.style.display = "block";
  clearTimeout(captionEl._t);
  captionEl._t = setTimeout(() => { captionEl.style.display = "none"; }, 3500);

  const themes = detectThemes(text);
  const numRespond = ri(3, 5);
  for (let i = 0; i < numRespond; i++) {
    setTimeout(() => {
      if (themes.length > 0 && Math.random() < 0.75) {
        spawnChat(rnd(rnd(themes).replies));
      } else {
        spawnChat();
      }
    }, i * ri(180, 420));
  }
  if (Math.random() < 0.6) setTimeout(() => residentReply(), ri(400, 900));
  state.hype = Math.min(1, state.hype + 0.15);
}

// ============ СОБЫТИЯ ============
function bigEvent() {
  if (Math.random() < 0.55) {
    const [name, color] = rnd(BLOGGERS);
    spawnBanner(`⭐ ${name} зашёл`, "топ-блогер 🎉", color, name);
    spawnNote(`${name} зашёл`, "известный блогер", color);
    sfx.blogger();
    state.tv += ri(4000, 15000);
    state.likes += ri(3000, 9000);
    state.hype = Math.min(1, state.hype + 0.6);
    boom("🔥", 20);
    for (let i=0; i<8; i++)
      setTimeout(() => spawnChat(rnd([`${name} тут!`,"ооо это же он","го го го 🔥",`${name} привет!`,"легенда!"])), i*120);
  } else {
    const d = rnd(DONATORS), a = rnd([1000,2000,5000,10000]), c = rnd(DONATE_COMMENTS);
    spawnBanner(`💎 ${d} → ${a.toLocaleString("ru-RU")} ₽`, c, "#ff50b4", d);
    spawnNote(`${d} +${a.toLocaleString("ru-RU")} ₽`, c, "#ff78c8");
    sfx.donateBig();
    state.coins += a * 10;
    state.tv += ri(1000, 4000);
    state.hype = Math.min(1, state.hype + 0.6);
    boom("💎", 18);
  }
  state.lastEvent = Date.now();
  shakeUI();
}

function smallEvent() {
  const r = Math.random();
  if (r < 0.35) {
    state.likes += ri(80, 500);
    state.hype = Math.min(1, state.hype + 0.08);
    sfx.like();
    boom(rnd(["❤️","🔥","👍"]), 6);
  } else if (r < 0.7) {
    boom(rnd(EMOJIS), ri(4, 9));
    sfx.pop();
  } else {
    const d = rnd(DONATORS), a = rnd([50,100,200,500]);
    state.coins += a * 10;
    spawnNote(`${d} +${a} ₽`, rnd(DONATE_COMMENTS), "#ff96dc");
    sfx.donateSmall();
    boom("💎", 5);
  }
  state.lastEvent = Date.now();
}

// ============ СЧЁТЧИКИ ============
let lastTick = performance.now();
function updateCounters(dt) {
  state.hype = Math.max(0, state.hype - dt*0.18);
  state.tv += 4*dt + state.hype*500*dt;
  state.viewers += (state.tv - state.viewers) * Math.min(1, dt*2.2);
  if (Date.now() - state.lastEvent > 15000) state.tv *= (1 - 0.01*dt);
  const v = state.viewers;
  $("viewers").textContent = v > 999 ? (v/1000).toFixed(1) + "K" : Math.floor(v);
}

// ============ ЦИКЛ ============
let lastChat = 0, lastEv = 0, lastNotify = 0, lastLike = 0,
    lastResident = 0, lastReply = 0;

function loop(now) {
  const dt = (now - lastTick) / 1000;
  lastTick = now;

  const chatInt = Math.max(0.25, 1.5 - state.hype * 1.05) * 1000;
  if (now - lastChat > chatInt) { spawnChat(); lastChat = now; }

  const resInt = (2200 - state.hype * 1400) + Math.random() * 1500;
  if (now - lastResident > resInt) {
    residentSpam(rnd(RESIDENTS));
    lastResident = now;
  }

  const replyChance = 0.4 + state.hype * 0.4;
  if (now - lastReply > (900 + Math.random()*1800) && Math.random() < replyChance) {
    residentReply(); lastReply = now;
  }

  if (now - lastEv > (3500 + Math.random()*3500)) {
    (Math.random() < 0.32 + state.hype*0.4 ? bigEvent : smallEvent)();
    lastEv = now;
  }

  if (now - lastNotify > (5000 + Math.random()*5000)) {
    spawnNote(`${rnd(NICKS)} зашёл`, "", "#78c8ff");
    sfx.viewer();
    lastNotify = now;
  }

  if (now - lastLike > (600 + Math.random()*1000)) {
    state.likes += ri(3, 25);
    if (state.hype > 0.3) boom(rnd(["❤️","🔥"]), 2);
    lastLike = now;
  }

  updateCounters(dt);
  requestAnimationFrame(loop);
}

// ============ КАМЕРА ============
async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: state.facing, width:{ideal:1280}, height:{ideal:720} },
      audio: false
    });
    const cam = $("cam");
    if (cam.srcObject) cam.srcObject.getTracks().forEach(t => t.stop());
    cam.srcObject = stream;
    await cam.play();
    return true;
  } catch (e) {
    alert("Не удалось открыть камеру: " + e.message);
    return false;
  }
}

async function flipCamera() {
  state.facing = state.facing === "user" ? "environment" : "user";
  toast(state.facing === "user" ? "Фронтальная камера" : "Задняя камера");
  $("cam").style.transform = state.facing === "user" ? "scaleX(-1)" : "none";
  const wasScreen = state.screenOn;
  await startCamera();
  if (wasScreen) {
    // обновим island превью
    $("islandCam").srcObject = $("cam").srcObject;
    $("cam").style.display = "none";
  }
}

// ============ ТРАНСЛЯЦИЯ ЭКРАНА + DYNAMIC ISLAND ============
async function toggleScreen() {
  if (state.screenOn) {
    const s = $("screen");
    if (s.srcObject) { s.srcObject.getTracks().forEach(t => t.stop()); s.srcObject = null; }
    s.style.display = "none";
    $("cam").style.display = "block";
    state.screenOn = false;
    document.body.classList.remove("screen-mode");
    $("rbScreen").classList.remove("on");
    $("islandCam").srcObject = null;
    toast("Вернулись к камере");
    return;
  }
  try {
    if (!navigator.mediaDevices.getDisplayMedia) {
      toast("На iPhone это не работает — используй Запись экрана");
      return;
    }
    const stream = await navigator.mediaDevices.getDisplayMedia({ video: true });
    const s = $("screen");
    s.srcObject = stream;
    s.style.display = "block";
    $("cam").style.display = "none";
    state.screenOn = true;
    document.body.classList.add("screen-mode");
    $("rbScreen").classList.add("on");
    // копируем поток камеры в island preview
    if ($("cam").srcObject) {
      $("islandCam").srcObject = $("cam").srcObject;
    }
    toast("Трансляция экрана");
    stream.getVideoTracks()[0].onended = () => { if (state.screenOn) toggleScreen(); };
  } catch (e) {
    toast("Отменено");
  }
}

// ============ РАСПОЗНАВАНИЕ РЕЧИ ============
let recognition = null;
function startMic() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { toast("Браузер не поддерживает распознавание речи"); return false; }
  if (state.micOn) {
    state.micOn = false;
    if (recognition) { try { recognition.stop(); } catch(e){} }
    $("rbMic").classList.remove("on");
    toast("Микрофон выключен");
    return true;
  }
  try {
    recognition = new SR();
    recognition.lang = "ru-RU";
    recognition.continuous = true;
    recognition.interimResults = false;
    recognition.onresult = (e) => {
      const last = e.results[e.results.length - 1];
      if (last.isFinal) {
        const text = last[0].transcript.trim();
        if (text) onUserSpoke(text);
      }
    };
    recognition.onerror = (e) => {
      if (e.error === "not-allowed") toast("Разреши микрофон в настройках");
    };
    recognition.onend = () => { if (state.micOn) { try { recognition.start(); } catch(e){} } };
    recognition.start();
    state.micOn = true;
    $("rbMic").classList.add("on");
    toast("Микрофон включён — говори!");
    return true;
  } catch (e) { toast("Ошибка микрофона"); return false; }
}

// ============ КНОПКИ ============
function pulse(el) {
  el.classList.add("pulse");
  setTimeout(() => el.classList.remove("pulse"), 380);
}
$("rbFlip").addEventListener("click", e => { pulse(e.currentTarget); flipCamera(); });
$("rbScreen").addEventListener("click", e => { pulse(e.currentTarget); toggleScreen(); });
$("rbMic").addEventListener("click", e => { pulse(e.currentTarget); startMic(); });
$("rbEvent").addEventListener("click", e => {
  pulse(e.currentTarget); bigEvent(); toast("🔥 Большой ивент!");
});
$("rbMute").addEventListener("click", e => {
  pulse(e.currentTarget);
  state.muted = !state.muted;
  e.currentTarget.textContent = state.muted ? "🔇" : "🔊";
  toast(state.muted ? "Звук выключен" : "Звук включён");
});
$("closeX").addEventListener("click", () => {
  if (confirm("Закрыть стрим?")) location.reload();
});

// ============ СТАРТ ============
$("startBtn").addEventListener("click", async () => {
  initAudio();
  const ok = await startCamera();
  if (!ok) return;
  try {
    await navigator.mediaDevices.getUserMedia({ audio: true });
    startMic();
  } catch (e) {}
  $("start").style.display = "none";
  setTimeout(() => spawnNote("Ты в эфире!", "Говори — боты слушают", "#8cff8c"), 500);
  requestAnimationFrame(loop);
});

document.body.addEventListener("touchstart", initAudio, { once: true });
</script>

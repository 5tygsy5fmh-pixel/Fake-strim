<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<title>LIVE</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { width:100%; height:100%; overflow:hidden; background:#000;
  font-family:-apple-system,"Segoe UI",Roboto,sans-serif; color:#fff;
  user-select:none; -webkit-user-select:none; position:fixed; }

#cam, #screen {
  position:fixed; top:0; left:0;
  width:100vw; height:100vh;
  object-fit:cover; -webkit-object-fit:cover;
  object-position:center center;
  background:#000; z-index:1;
}
#cam { transform:scaleX(-1); }
#screen { display:none; }
#ui { position:fixed; inset:0; z-index:2; pointer-events:none; }

#island { position:absolute; top:calc(8px + env(safe-area-inset-top)); left:50%;
  transform:translateX(-50%) scale(.5); opacity:0; pointer-events:none;
  display:flex; align-items:center; gap:8px; background:#000; color:#fff;
  border-radius:22px; padding:4px 12px 4px 4px; height:34px; z-index:5;
  box-shadow:0 6px 20px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.08);
  transition:opacity .25s, transform .35s cubic-bezier(.2,1.3,.4,1); }
body.screen-mode #island { opacity:1; transform:translateX(-50%) scale(1); }
#islandCam { width:26px; height:26px; border-radius:50%; object-fit:cover;
  background:#1a1a1a; transform:scaleX(-1); }
.island-info { display:flex; align-items:center; gap:6px; }
.island-dot { width:8px; height:8px; border-radius:50%; background:#ff3838;
  box-shadow:0 0 8px #ff3838; animation:dotPulse 1.4s ease-in-out infinite; }
@keyframes dotPulse { 0%,100%{opacity:1; transform:scale(1);} 50%{opacity:.35; transform:scale(.85);} }
.island-txt { font-size:11px; font-weight:800; letter-spacing:.6px; }

.top { position:absolute; top:0; left:0; right:0; padding:12px 12px 40px;
  padding-top:calc(12px + env(safe-area-inset-top));
  background:linear-gradient(180deg,rgba(0,0,0,.65) 0%,rgba(0,0,0,0) 100%);
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  transition:opacity .3s; z-index:10; }
body.screen-mode .top { opacity:.55; }
.host { display:flex; align-items:center; gap:8px; min-width:0; }
.host-av { width:34px; height:34px; border-radius:50%; flex:0 0 34px;
  background:#000; overflow:hidden;
  box-shadow:0 0 0 2px rgba(255,255,255,.5); }
.host-av svg { width:100%; height:100%; display:block; }
.host-name { font-size:14px; font-weight:700; max-width:110px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.verified { width:13px; height:13px; border-radius:50%; background:#20a8f0;
  display:inline-flex; align-items:center; justify-content:center;
  font-size:8px; font-weight:800; flex:0 0 13px; }
.chev { opacity:.7; font-size:10px; }
.top-right { display:flex; align-items:center; gap:8px; }
.live-badge { background:#ff2850; padding:3px 7px; border-radius:4px;
  font-size:11px; font-weight:800; letter-spacing:.5px; }
.viewers { display:flex; align-items:center; gap:5px;
  background:rgba(0,0,0,.5); padding:4px 8px; border-radius:5px;
  font-size:12px; font-weight:700; }
.viewers svg { width:14px; height:14px; }
.close-x { width:28px; height:28px; display:flex; align-items:center;
  justify-content:center; pointer-events:auto; cursor:pointer; }
.close-x svg { width:22px; height:22px; }

.rail { position:absolute; right:6px; bottom:auto; top:22%;
  display:flex; flex-direction:column; gap:16px; align-items:center;
  pointer-events:auto; transition:top .3s; z-index:9; }
body.screen-mode .rail { top:70px; }
.rb { width:40px; height:40px; display:flex; align-items:center;
  justify-content:center; cursor:pointer; position:relative;
  transition:transform .12s cubic-bezier(.2,1.4,.4,1); }
.rb:active { transform:scale(.82); }
.rb svg { width:28px; height:28px; display:block;
  filter:drop-shadow(0 2px 5px rgba(0,0,0,.75)); }
.rb.red-active.on svg path, .rb.red-active.on svg circle,
.rb.red-active.on svg rect, .rb.red-active.on svg polyline,
.rb.red-active.on svg line { stroke:#ff2850 !important; }
.rb.pulse { animation:rpls .35s ease-out; }
@keyframes rpls { 0%{transform:scale(1);} 50%{transform:scale(1.2);} 100%{transform:scale(1);} }

.rail-av { position:relative; margin-bottom:6px; }
.rail-av .host-av { width:40px; height:40px; flex:0 0 40px;
  box-shadow:0 0 0 2px #fff; }
.rail-av .plus { position:absolute; bottom:-6px; left:50%;
  transform:translateX(-50%); width:18px; height:18px;
  background:#ff2850; border-radius:50%; display:flex;
  align-items:center; justify-content:center; font-size:13px;
  font-weight:800; color:#fff; border:2px solid #000; }

.comments { position:absolute; left:12px; right:80px; bottom:110px;
  max-height:50%; overflow:hidden; display:flex; flex-direction:column;
  justify-content:flex-end; gap:7px; transition:all .35s ease;
  z-index:3; }
.cm { display:flex; align-items:flex-start; gap:8px; background:rgba(0,0,0,.42);
  backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  padding:7px 12px 7px 8px; border-radius:20px; max-width:100%;
  animation:cmin .28s ease-out; }
.cm.reply { margin-left:26px; background:rgba(0,0,0,.55); }
@keyframes cmin { from{opacity:0; transform:translateY(12px);} to{opacity:1;} }
.cm-av { flex:0 0 26px; width:26px; height:26px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:12px; font-weight:800; }
.cm-body { flex:1; min-width:0; }
.cm-nick { font-size:11px; opacity:.75; margin-bottom:1px; }
.cm-text { font-size:13px; line-height:1.3; word-break:break-word; }

body.banner-show .comments { opacity:0; transform:translateY(20px); }

body.screen-mode .comments { left:6px; right:72px; top:70px; bottom:auto;
  max-height:calc(100vh - 220px); justify-content:flex-start; gap:5px;
  padding-top:4px; padding-bottom:8px; overflow-y:auto; overflow-x:hidden;
  scrollbar-width:none;
  -webkit-mask-image:linear-gradient(180deg,#000 0%,#000 85%,transparent 100%);
  mask-image:linear-gradient(180deg,#000 0%,#000 85%,transparent 100%); }
body.screen-mode .comments::-webkit-scrollbar { display:none; }
body.screen-mode .cm { max-width:58%; padding:5px 11px 5px 6px;
  border-radius:16px; background:rgba(0,0,0,.55); }
body.screen-mode .cm.reply { margin-left:0; background:rgba(0,0,0,.68); }
body.screen-mode .cm-av { flex:0 0 20px; width:20px; height:20px; font-size:10px; }
body.screen-mode .cm-nick { font-size:9px; }
body.screen-mode .cm-text { font-size:11px; line-height:1.25; }
body.screen-mode .cm:nth-child(odd)  { align-self:flex-start; }
body.screen-mode .cm:nth-child(even) { align-self:flex-end; }

.caption { position:absolute; left:16px; right:80px; bottom:56px;

  background:rgba(0,0,0,.72); border-radius:14px; display:none;

.caption.interim { opacity:.75; font-style:italic; }
@keyframes capIn { from{opacity:0; transform:translateY(6px);} to{opacity:1;} }
body.screen-mode .caption { right:72px; bottom:24px; font-size:13px; padding:7px 11px; }

.hearts { position:absolute; right:20px; bottom:auto; top:60%;

.heart { position:absolute; bottom:0; font-size:26px;

.notes { position:absolute; top:80px; left:12px; right:12px;

body.screen-mode .notes { top:56px; opacity:.85; }
.note { background:linear-gradient(135deg, rgba(0,0,0,.85), rgba(40,10,60,.85));

.note.sub b { color:#8cff8c; }
.note.donate { border-left:3px solid #ff50b4; }
.note.sub { border-left:3px solid #8cff8c; }
@keyframes ntin { from{transform:translateX(-30px) scale(.9); opacity:0;}

.banner { position:absolute; top:24%; left:16px; right:16px;

.banner .b-amount { font-size:32px; font-weight:900;

.banner .b-text { font-size:15px; opacity:.95; line-height:1.45;

@keyframes bnin {
  0%{transform:scale(.5); opacity:0;}
  60%{transform:scale(1.05); opacity:1;}
  100%{transform:scale(1);}
}

#start { position:fixed; inset:0; z-index:40; background:#0a0a14;
  display:flex; flex-direction:column; align-items:center;

.toast { position:absolute; bottom:200px; left:50%; transform:translateX(-50%);

.toast.show { opacity:1; }

.shake { animation:shk .4s; }
@keyframes shk { 0%,100%{transform:none;} 20%{transform:translate(-3px,2px);} 40%{transform:translate(3px,-2px);} 60%{transform:translate(-2px,-1px);} 80%{transform:translate(2px,1px);} }
</style>

function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();

}
function tone(freq, dur, vol=0.25, type="sine", delay=0, slideTo=null) {
  if (state.muted || !audioCtx) return;
  const t0 = audioCtx.currentTime + delay;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t0);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0+dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  o.connect(g).connect(audioCtx.destination);
  o.start(t0); o.stop(t0+dur+0.05);
}

const pipCanvas = document.createElement("canvas");
pipCanvas.width = 540; pipCanvas.height = 960;
const pipCtx = pipCanvas.getContext("2d");
const pipVideo = $("pipVideo");
let pipStream = null;
const pipHistory = [];
let pipCaption = "";

function pipAdd(nick, text, color, isReply) {
  pipHistory.push({ nick, text, color, isReply, t: Date.now() });
  while (pipHistory.length > 12) pipHistory.shift();
}

function drawCovered(ctx, video, W, H, mirror) {
  if (!video || video.readyState < 2 || !video.videoWidth) return;
  const vw = video.videoWidth, vh = video.videoHeight;
  const scale = Math.max(W/vw, H/vh);
  const dw = vw*scale, dh = vh*scale;
  const dx = (W-dw)/2, dy = (H-dh)/2;
  if (mirror) {
    ctx.save(); ctx.translate(W, 0); ctx.scale(-1, 1);
    ctx.drawImage(video, W-dx-dw, dy, dw, dh); ctx.restore();
  } else ctx.drawImage(video, dx, dy, dw, dh);
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

function renderPiP() {
  const W = pipCanvas.width, H = pipCanvas.height;
  const videoH = Math.floor(H * 0.60);
  const captionH = 60;
  const chatH = H - videoH - captionH;

  pipCtx.fillStyle = "#000";
  pipCtx.fillRect(0, 0, W, H);

  const cam = $("cam"), screen = $("screen");
  const useScreen = state.screenOn && screen.readyState >= 2 && screen.videoWidth;
  if (useScreen) drawCovered(pipCtx, screen, W, videoH, false);
  else drawCovered(pipCtx, cam, W, videoH, state.facing === "user");

  pipCtx.fillStyle = "#0a0a0a";
  pipCtx.fillRect(0, videoH, W, captionH);
  if (pipCaption) {
    pipCtx.fillStyle = "#fff";
    pipCtx.font = "700 22px -apple-system,sans-serif";
    pipCtx.textAlign = "center";
    pipCtx.textBaseline = "middle";
    let t = pipCaption;
    const maxW = W - 40;
    while (pipCtx.measureText(t).width > maxW && t.length > 1) {
      t = t.slice(0, -1);
    }
    pipCtx.fillText(t, W/2, videoH + captionH/2);
  }

  pipCtx.fillStyle = "#000";
  pipCtx.fillRect(0, videoH + captionH, W, chatH);
  pipCtx.fillStyle = "rgba(255,255,255,.15)";
  pipCtx.fillRect(0, videoH + captionH, W, 2);
  pipCtx.fillRect(0, videoH, W, 1);

  const now = Date.now();
  const items = pipHistory.filter(m => now - m.t < 15000).slice(-6);
  pipCtx.textBaseline = "middle";
  pipCtx.textAlign = "left";
  let y = videoH + captionH + 26;
  const lineH = 38;
  for (let i = items.length - 1; i >= 0; i--) {
    const m = items[i];
    const size = 19;
    pipCtx.font = `700 ${size}px -apple-system,sans-serif`;
    const nickW = pipCtx.measureText(m.nick + ": ").width;
    let finalText = m.text;
    const maxW = W - 60 - nickW;
    pipCtx.font = `500 ${size}px -apple-system,sans-serif`;
    while (pipCtx.measureText(finalText).width > maxW && finalText.length > 1) {
      finalText = finalText.slice(0, -1);
    }
    pipCtx.fillStyle = m.color || "#fff";
    pipCtx.font = `700 ${size}px -apple-system,sans-serif`;
    const x = m.isReply ? 30 : 16;
    pipCtx.fillText(m.nick + ":", x, y);
    pipCtx.fillStyle = "#f0f0f0";
    pipCtx.font = `500 ${size}px -apple-system,sans-serif`;
    pipCtx.fillText(finalText, x + nickW, y);
    y += lineH;
    if (y > H - 10) break;
  }

  pipCtx.fillStyle = "#ff2850";
  roundRect(pipCtx, 14, 14, 58, 26, 6);
  pipCtx.fill();
  pipCtx.fillStyle = "#fff";
  pipCtx.font = "800 14px -apple-system,sans-serif";
  pipCtx.textAlign = "left";
  pipCtx.fillText("LIVE", 26, 28);

  pipCtx.fillStyle = "rgba(0,0,0,.55)";
  const vTxt = (state.viewers > 999 ? (state.viewers/1000).toFixed(1) + "K" : Math.floor(state.viewers));
  pipCtx.font = "700 14px -apple-system,sans-serif";
  const vw2 = pipCtx.measureText(vTxt).width + 34;
  roundRect(pipCtx, 80, 14, vw2, 26, 6);
  pipCtx.fill();
  pipCtx.strokeStyle = "#fff"; pipCtx.lineWidth = 1.8;
  pipCtx.beginPath();
  pipCtx.ellipse(92, 27, 8, 5, 0, 0, Math.PI*2);
  pipCtx.stroke();
  pipCtx.beginPath(); pipCtx.arc(92, 27, 2, 0, Math.PI*2); pipCtx.stroke();
  pipCtx.fillStyle = "#fff";
  pipCtx.fillText(vTxt, 104, 28);
}

let lastChat=0, lastEv=0, lastNotify=0, lastResident=0, lastAutoEmoji=0;
const donationCooldown = 60000;
const subCooldown = 45000;

function loop(now) {
  const dt = (now - lastTick) / 1000;
  lastTick = now;

  const chatInt = Math.max(0.8, 2.2 - state.hype * 1.2) * 1000;
  if (now - lastChat > chatInt) { spawnChat(); lastChat = now; }

  const resInt = (3500 - state.hype * 1500) + Math.random() * 1500;
  if (now - lastResident > resInt) { residentSpam(rnd(RESIDENTS)); lastResident = now; }

  if (now - lastEv > donationCooldown + Math.random()*20000) {
    donationEvent(); lastEv = now;
  }
  if (now - lastNotify > subCooldown + Math.random()*20000) {
    subscriptionEvent(); lastNotify = now;
  }

  if (state.emojisOn) {
    const autoInt = 700 + Math.random() * 900;
    if (now - lastAutoEmoji > autoInt) {
      const batch = ri(1, 3);
      boom(pickEmoji(), batch);
      lastAutoEmoji = now;
    }
  }

  updateCounters(dt);
  renderPiP();
  if (state.pipActive && pipVideo.paused) pipVideo.play().catch(()=>{});
  requestAnimationFrame(loop);
}

    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: state.facing, width:{ideal:1280}, height:{ideal:720} },
      audio: false
    });
    const cam = $("cam");
    if (cam.srcObject) cam.srcObject.getTracks().forEach(t => t.stop());
    cam.srcObject = stream;
    await cam.play();
    return true;
  } catch (e) { alert("Не удалось открыть камеру: " + e.message); return false; }
}

async function flipCamera() {
  state.facing = state.facing === "user" ? "environment" : "user";
  toast(state.facing === "user" ? "Фронтальная камера" : "Задняя камера");
  $("cam").style.transform = state.facing === "user" ? "scaleX(-1)" : "none";
  await startCamera();
}

async function toggleScreen() {
  if (state.screenOn) {
    const s = $("screen");
    if (s.srcObject) { s.srcObject.getTracks().forEach(t => t.stop()); s.srcObject = null; }
    s.style.display = "none";
    $("cam").style.display = "block";
    state.screenOn = false;
    document.body.classList.remove("screen-mode");
    $("rbScreen").classList.remove("on");
    toast("Вернулись к камере"); return;
  }
  try {
    if (!navigator.mediaDevices.getDisplayMedia) {
      toast("На iPhone — используй штатную Запись экрана"); return;
    }
    const stream = await navigator.mediaDevices.getDisplayMedia({ video: true });
    const s = $("screen");
    s.srcObject = stream; s.style.display = "block";
    $("cam").style.display = "none";
    state.screenOn = true;
    document.body.classList.add("screen-mode");
    $("rbScreen").classList.add("on");
    toast("Трансляция экрана");
    stream.getVideoTracks()[0].onended = () => { if (state.screenOn) toggleScreen(); };
  } catch (e) { toast("Отменено"); }
}

let recognition = null;
let micRunning = false;

function startMicAuto() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { toast("Распознавание речи не поддерживается"); return; }
  if (micRunning) return;
  try {
    recognition = new SR();
    recognition.lang = "ru-RU";
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.onresult = (e) => {
      let interim = "", final = "";
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const t = e.results[i][0].transcript;
        if (e.results[i].isFinal) final += t;
        else interim += t;
      }
      if (state.micMuted) return;
      if (interim) { showCaption(interim, true); pipCaption = interim; }
      if (final) {
        showCaption(final, false);
        pipCaption = final;
        onUserSpoke(final.trim());
        setTimeout(() => { if (pipCaption === final) pipCaption = ""; }, 2500);
      }
    };
    recognition.onerror = (e) => {
      if (e.error === "not-allowed") toast("Разреши микрофон");
    };
    recognition.onend = () => {
      if (state.micOn && !state.micMuted) {
        micRunning = false;
        setTimeout(() => { if (state.micOn && !state.micMuted) startMicAuto(); }, 300);
      } else {
        micRunning = false;
      }
    };
    recognition.start();
    micRunning = true;
    state.micOn = true;
    $("micSlash").style.display = "none";
  } catch (e) { console.error(e); }
}

function toggleMic() {
  if (!state.micMuted) {
    state.micMuted = true;
    $("micSlash").style.display = "block";
    toast("🔇 Микрофон выключен");
    captionEl.style.display = "none";
    pipCaption = "";
  } else {
    state.micMuted = false;
    $("micSlash").style.display = "none";
    toast("🎤 Микрофон включён");
    if (!micRunning) startMicAuto();
  }
}

function toggleEmojis() {
  state.emojisOn = !state.emojisOn;
  if (state.emojisOn) {
    $("emojiSlash").style.display = "none";
    $("rbEmoji").classList.add("on");
    toast("😊 Смайлики включены");
  } else {
    $("emojiSlash").style.display = "block";
    $("rbEmoji").classList.remove("on");
    toast("😊 Смайлики выключены");
  }
}

function pulse(el) {
  el.classList.add("pulse");
  setTimeout(() => el.classList.remove("pulse"), 380);
}

$("rbScreen").addEventListener("click", e => { pulse(e.currentTarget); toggleScreen(); });
$("rbFlip").addEventListener("click", e => { pulse(e.currentTarget); flipCamera(); });
$("rbMic").addEventListener("click", e => { pulse(e.currentTarget); toggleMic(); });
$("rbEmoji").addEventListener("click", e => { pulse(e.currentTarget); toggleEmojis(); });
$("rbPiP").addEventListener("click", e => {
  pulse(e.currentTarget);
  if (state.pipActive) exitPiP(); else enterPiP();
});
$("closeX").addEventListener("click", () => { if (confirm("Закрыть стрим?")) location.reload(); });

$("startBtn").addEventListener("click", async () => {
  initAudio();
  const ok = await startCamera();
  if (!ok) return;
  pipStream = pipCanvas.captureStream(30);
  pipVideo.srcObject = pipStream;
  pipVideo.muted = true;
  try { await pipVideo.play(); } catch(e) {}
  try {
    await navigator.mediaDevices.getUserMedia({ audio: true });
    startMicAuto();
  } catch (e) {}
  $("start").style.display = "none";
  setTimeout(() => spawnNote("grand-cat в эфире!", "🎤 — мьют, 😊 — смайлики", "#8cff8c", "sub"), 500);
  requestAnimationFrame(loop);
});

document.body.addEventListener("touchstart", initAudio, { once: true });
</script>
</body>
